# Device B: idle current test, see src/idle_test.c and data_processing/idle_test.py
# build with -DEXTRA_CONF_FILE=idle_test.conf
CONFIG_BENCHMARK_IDLE_TEST=y

# serial shell disabled like in auto_dut.conf: the UART alone draws ~1 mA
# SHELL_BACKEND_SERIAL selects SERIAL, so it has to be switched off too, otherwise SERIAL stays y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y