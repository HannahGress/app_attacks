# Enable Security Management Protocol
CONFIG_BT_SMP=y

# Logger module
#CONFIG_LOG=y
#CONFIG_BT_LOG_SNIFFER_INFO=y
#CONFIG_LOG_PROCESS_THREAD=y
# allows to make sent packages visible ("Wireshark")
#CONFIG_BT_SMP_LOG_LEVEL_DBG=y
#CONFIG_LOG_MODE_OVERFLOW=y

#CONFIG_LOG_BUFFER_SIZE=4096

#CONFIG_BT_HCI_ERR_TO_STR=y
#CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="BLE Framework"
# CONFIG_BT_PRIVACY gives the DK/Central a RPA instead a NRPA
CONFIG_BT_PRIVACY=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
# When a bond is about to complete, find any other bond with the same
# peer address (or IRK) and `bt_unpair` that bond before the event `pairing_complete`.
#BT_ID_UNPAIR_MATCHING_BONDS=y

# setting configurations to allow flash handling
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# Increase the number of maximum paired devices
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_ID_MAX=20

# Increase stack size for the main thread and System Workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048
# CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1024

CONFIG_SHELL=y

CONFIG_BT_SMP_SC_ONLY=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n

# enable data length extension
# CONFIG_BT_CTLR_DATA_LENGTH=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=7

# stop the scan to repeatedly showing the same devices/AD packets
CONFIG_BT_CTLR_DUP_FILTER_LEN=128

# CONFIG_SOC_NRF53_CPUNET_ENABLE=y

# to enable %f when printing (shell or printf), so printing of double and float
CONFIG_CBPRINTF_FP_SUPPORT=y