# Device B (DUT): run the benchmark batch autonomously after boot
# build with -DEXTRA_CONF_FILE=auto_dut.conf
CONFIG_BENCHMARK_AUTO_DUT=y

# ###########################################################################
# /!\ THE SERIAL SHELL OF THIS BUILD IS DISABLED /!\
#
# The UART keeps drawing ~1 mA even without USB, which distorts the current
# measurement. Shell output goes to a dummy backend (nowhere) instead, so the
# serial terminal of Device B shows NOTHING and accepts NO commands.
#
# To talk to Device B over its serial terminal again, delete or comment out
# the three lines below and rebuild + reflash (or use the normal build).
# ###########################################################################
# SHELL_BACKEND_SERIAL selects SERIAL, so without this line SERIAL silently stays y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y